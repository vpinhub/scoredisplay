<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VPinhub · Apron Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #060610;
            color: #e4e4f0;
            font-family: 'Encode Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .hd {
            height: 56px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d1a;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 14px;
        }
        .hd-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #f97316, #d946ef);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .hd-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
        }
        .hd-sub {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #52526a;
        }

        /* ── CARDS AREA ── */
        .cards {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: stretch;
            padding: 20px;
            gap: 16px;
        }

        .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            background: #0d0d1a;
            padding: 24px 16px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, background 0.15s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--c-accent);
        }
        .card:hover, .card:active {
            transform: translateY(-2px);
            background: #13132a;
        }

        .card-icon {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: var(--c-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 24px color-mix(in srgb, var(--c-accent) 40%, transparent);
        }
        .card-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            line-height: 1.4;
        }
        .card-meta {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--c-accent);
            text-align: center;
        }
        .card-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #52526a;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .card-ttd { --c-accent: #f97316; }
        .card-swl { --c-accent: #d946ef; }
        .card-cc  { --c-accent: #6366f1; }

        /* ── PORTRAIT ── */
        @media (orientation: portrait) {
            .cards { flex-direction: column; padding: 16px; gap: 12px; }
            .card { flex-direction: row; padding: 20px; justify-content: flex-start; gap: 20px; }
            .card-icon { width: 44px; height: 44px; font-size: 18px; flex-shrink: 0; }
            .card-name { text-align: left; font-size: 12px; }
            .card-meta { text-align: left; }
        }
    </style>
</head>
<body>
<div class="layout">

    <header class="hd">
        <div class="hd-logo"></div>
        <div>
            <div class="hd-title">VPinhub</div>
            <div class="hd-sub">Apron Display</div>
        </div>
    </header>

    <div class="cards">

        <a class="card card-ttd" href="ttd.html">
            <div class="card-icon">🎳</div>
            <div class="card-name">Thursday<br>Throwdown</div>
            <div class="card-meta">Live · iScored</div>
            <div class="card-badge">Thu 2:00 PM ET</div>
        </a>

        <a class="card card-swl" href="swl.html">
            <div class="card-icon">💡</div>
            <div class="card-name">Special<br>When Lit</div>
            <div class="card-meta">Live · iScored</div>
            <div class="card-badge">Sun 2:00 PM ET</div>
        </a>

        <a class="card card-cc" href="vpc.html">
            <div class="card-icon">🎮</div>
            <div class="card-name">Competition<br>Corner</div>
            <div class="card-meta">Live · VPC Discord</div>
            <div class="card-badge">Mon 12:00 AM PT</div>
        </a>

    </div>

</div>
</body>
</html>
